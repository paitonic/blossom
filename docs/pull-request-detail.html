<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock GitHub PR Detail</title>
    <style>
        /* Minimal styles */
        body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background: #f6f8fa; padding: 20px; }
        .container { background: white; border: 1px solid #d0d7de; max-width: 900px; margin: 0 auto; padding: 20px; }

        /* Header */
        .markdown-title { font-size: 32px; font-weight: 400; }

        /* Timeline */
        .pull-discussion-timeline { margin-top: 20px; }
        .timeline-comment { border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 20px; }
        .timeline-comment-header { background: #f6f8fa; border-bottom: 1px solid #d0d7de; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; }
        .timeline-comment-actions { display: flex; align-items: center; gap: 8px; }
        .comment-body { padding: 16px; }

        /* Helpers */
        .flex-shrink-0 { flex-shrink: 0; }
        .d-flex { display: flex; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Title Section (Wrapped in diff-comparison-viewer-container for detection) -->
        <div id="diff-comparison-viewer-container">
            <h1 class="markdown-title">Refactor storage module</h1>
        </div>

        <!-- Main Timeline -->
        <div class="pull-discussion-timeline js-pull-discussion-timeline">

            <!-- First Comment (Description) -->
            <div id="pullrequest-103" class="timeline-comment">
                <div class="timeline-comment-header">
                    <div>
                        <strong>paitonic</strong> commented
                        <relative-time datetime="2026-02-06T12:00:00Z">today</relative-time>
                        <!-- Permalink for page detection -->
                        <a id="issue-103-permalink" href="#issue-103-permalink">permalink</a>
                    </div>

                    <!-- Injection Point -->
                    <div class="timeline-comment-actions flex-shrink-0 d-flex">
                        <button>Edit</button>
                    </div>
                </div>
                <div class="comment-body">
                    <p>This PR refactors the storage module</p>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
