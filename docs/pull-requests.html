<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Mock GitHub Page</title>
    </head>
    <body>
        <div class="logged-in env-production page-responsive">
            <h1>Mock GitHub Pull Requests</h1>
            <div class="issue-list">
                <!-- PR Item 1 -->
                <div class="pr-item js-issue-row">
                    <div class="flex-auto">
                        <a
                            id="issue_123_link"
                            href="https://github.com/github/docs/pull/123"
                            >My First Pull Request</a
                        >
                        <div class="meta-data">
                            <span class="opened-by">
                                #123 opened by user1
                                <relative-time
                                    datetime="2025-12-24T10:00:00Z"
                                ></relative-time>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- PR Item 2 -->
                <div class="pr-item js-issue-row">
                    <div class="flex-auto">
                        <a
                            id="issue_456_link"
                            href="https://github.com/github/docs/pull/456"
                            >Another PR</a
                        >
                        <div class="meta-data">
                            <span class="opened-by">
                                #456 opened by user2
                                <relative-time
                                    datetime="2025-12-25T12:30:00Z"
                                ></relative-time>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
